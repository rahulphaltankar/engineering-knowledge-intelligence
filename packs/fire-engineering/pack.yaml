name: fire-engineering
version: 0.1.0
description: >-
  Fire-engineering domain pack for the Engineering Knowledge Intelligence public
  demonstrator. Original demonstrator content: specialist operating profiles,
  a synthetic corpus and one scenario (SCN-F01). Contains no consultancy, client
  or project data and reproduces no standards text.
licence: >-
  Original demonstrator content. Licence to be set by the repository owner
  before redistribution - see docs/THIRD_PARTY.md.
data_classification: SIMULATED — PUBLIC DEMONSTRATOR DATA
generated_by: scripts/generate_fire_corpus.py

# Provenance stamped on every record the connector returns from this pack.
dataset:
  connector_id: FIRE_SIMULATION
  connector_name: Fire engineering synthetic knowledge corpus
  source_url: packs/fire-engineering/data (synthetic; generated by scripts/generate_fire_corpus.py)
  licence: Synthetic demonstrator data - see docs/THIRD_PARTY.md

provides:
  - agent: fire-engineer
  - agent: fire-hazard-reviewer
  - agent: fire-requirements-analyst
  - agent: verification-evidence-planner
  - simulation-connector-data

# Everything the appliance needs to serve this domain. No orchestration code
# changes per domain: the pipeline, gate, workflow engine and provenance are
# shared with the automotive demonstration.
domain_profile:
  domain: fire-engineering
  label: Fire engineering
  specialist: fire-engineering
  connector_id: FIRE_SIMULATION
  presentation: knowledge
  surface: fire
  # Wording used by the shared specialists when they serve this domain.
  terms:
    failure_mode: fire hazard
    action_priority: review priority
    risk_graph: hazard relationship graph
    verifying_test: verification activity
    test_case: verification activity
  # Labels for entity types, record fields and output columns in this surface.
  labels:
    EngineeringChange: Change
    System: Fire-safety domain
    Subsystem: Sub-system
    Component: Element
    Requirement: Requirement
    FailureMode: Fire hazard
    TestCase: Verification activity
    TestResult: Verification result
    Evidence: Evidence record
    Standard: Standard / guidance
    Document: Document
    failure_mode: hazard
    mode: hazard
    failure_effect: consequence
    effect: consequence
    failure_cause: cause
    action_priority: review priority
    test: verification activity
    test_id: verification activity
    failure_modes: hazards addressed
    phase: stage
    evidence_records: evidence records
    findings: supporting findings
    finding_id: finding
    gap_type: evidence condition
    system: domain record
    classification_confidence: classification / confidence
    verifies_requirements: verifies requirements
  # URL names for workflows in this surface.
  workflow_aliases:
    verification-evidence-plan: dvpr
    change-impact-assessment: engineering_impact_assessment
    evidence-assessment: evidence_gap_analysis
  disclaimer: >-
    Public demonstrator. Synthetic data only - not BB7 internal data, not client
    or project data, and not an OEM implementation. Not fire safety design,
    certification or sign-off software. Every output requires review by a
    competent fire engineer.
  definitions:
    domain: fire-engineer
    quality: fire-hazard-reviewer
    requirements: fire-requirements-analyst
    evidence: verification-evidence-planner
  display_names:
    domain: Fire Engineer
    quality: Fire Hazard Reviewer
    requirements: Requirements Applicability Analyst
    evidence: Evidence & Transferability Analyst
  vocabulary:
    product_name: Engineering Knowledge Intelligence
    change_heading: Change under assessment
    affected_heading: Fire-safety domains affected
    affected_metric: Fire-safety domains
    cross_domain_metric: Reached via relationships
    gaps_metric: Evidence gaps
    attention_heading: Evidence conditions needing attention
    actions_heading: Recommended verification actions (for reviewer decision)
    unknowns_heading: Not established from the available evidence
    risk_heading: Fire hazards in scope (qualitative review priority)
    risk_rating: priority
    analyse_button: Assess change
    subject_noun: change
  outputs:
    - engineering_impact_assessment
    - dvpr
    - evidence_gap_analysis
    - requirements_impact_analysis
    - traceability_matrix
    - compliance_standards_impact
    - engineering_decision_brief
  workflows:
    dvpr:
      name: Verification & Evidence Plan
      description: >-
        Requirement to verification activity to result and evidence to finding,
        with transferability and reviewer decisions applied. Where no acceptance
        criterion is established the plan says so - none is ever assumed.
      upstream_skills: [verification-evidence-planner, fire-engineer]
      sections:
        - builder: dvpr_table
          params:
            key: plan
            title: Verification & evidence plan
            hazard_noun: fire hazards
            unestablished_criterion: >-
              NOT ESTABLISHED - no acceptance criterion is recorded for this
              verification activity. A project-specific criterion must be agreed
              by the responsible fire engineer; none has been assumed.
        - builder: evidence_transferability
        - builder: evidence_gaps
        - builder: review_record
        - builder: finding_list
          params:
            key: verification_findings
            title: Findings supporting this plan
            tags: [verification_gap, evidence_summary, transferability,
                   evidence_gap, applicability_unknown, design_input_unknown]
        - builder: confidence_summary
          params:
            title: Confidence
        - builder: unknowns
          params:
            title: Assumptions & unknowns - not established from the evidence
    engineering_impact_assessment:
      name: Fire Engineering Change Impact Assessment
      upstream_skills: [fire-engineer, fire-requirements-analyst, fire-hazard-reviewer]
      sections:
        - builder: executive_summary
          params:
            title: Change impact summary
            systems_label: fire-safety domain(s)
            hazard_noun: fire hazards
        - builder: finding_list
          params:
            key: classification
            title: Change classification
            tags: [change_classification]
        - builder: impacted_systems
          params:
            title: Fire-safety domains affected, with the path that justifies each
        - builder: applicable_requirements
        - builder: finding_list
          params:
            key: basis
            title: Records established on the superseded basis
            tags: [basis_conflict]
        - builder: risk_table
          params:
            title: Fire hazards in scope
        - builder: evidence_gaps
        - builder: review_record
        - builder: confidence_summary
          params:
            title: Confidence
        - builder: unknowns
          params:
            title: Assumptions & unknowns - not established from the evidence
    evidence_gap_analysis:
      name: Evidence Assessment
      upstream_skills: [verification-evidence-planner]
      sections:
        - builder: evidence_gaps
        - builder: evidence_transferability
        - builder: evidence_table
        - builder: finding_list
          params:
            key: evidence_findings
            title: Evidence findings
            tags: [evidence_summary, evidence_gap, transferability]
        - builder: review_record
        - builder: confidence_summary
          params:
            title: Confidence
        - builder: unknowns
          params:
            title: Assumptions & unknowns - not established from the evidence
  catalogue_names:
    dvpr: Verification & Evidence Plan
    engineering_impact_assessment: Fire Engineering Change Impact Assessment
    compliance_standards_impact: Regulatory & Standards Applicability
    evidence_gap_analysis: Evidence Assessment
    engineering_decision_brief: Technical Decision Brief
    requirements_impact_analysis: Requirements Applicability
    traceability_matrix: Knowledge Relationship Matrix
